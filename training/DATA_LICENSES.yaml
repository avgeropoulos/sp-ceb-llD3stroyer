# Every data source a fine-tuning run uses must be listed here with its license and approved: true,
# and the owner must set owner_approval.approved: true after going through the checklist.
# training/bouzouki_train/finetune.py refuses to train otherwise (only --dry-run skips the approval,
# never the forbidden-source scan). `python -m bouzouki_train.license_gate --data data/tfrecords`
# shows what is missing.
#
# The run's source ids come from the dataset metadata (build_dataset.py --source-id / --ir-source-id /
# --renderer-source-id), plus `basic_pitch_icassp_2022` (pretrained weights) and, with --val-real,
# `owner_recordings_validation`.

owner_approval:
  approved: false        # the owner sets this to true (a YAML boolean), by hand, after the checklist
  approved_by: ""        # name
  date: ""               # YYYY-MM-DD

checklist:
  - "Every source below is one I have the right to use for training a model shipped in a commercial app."
  - "No data, weights or code from SynthTab (CC BY-NC 4.0), MuScriptor (non-commercial weights) or gtrsnipe (non-commercial code) is used, copied, converted or derived from - not even for validation or as a teacher model."
  - "No commercial recordings (records, YouTube, streaming) are in the training or validation sets."
  - "Impulse responses: each IR file is my own measurement or under a license allowing commercial use (e.g. CC0 / CC BY with attribution kept in NOTICE)."
  - "Sample libraries / SoundFonts (if any): the license allows using renders to train a model, not only to make music."
  - "My own recordings (training and validation) were made by me, or by players who agreed in writing."
  - "Python packages: requirements.txt is Apache/MIT/BSD/MPL/PSF; I accept the transitive ISC/LGPL tools listed in README (training-time only, not shipped)."

sources:
  - id: basic_pitch_icassp_2022
    description: "Pretrained Basic Pitch weights (icassp_2022 / nmp), shipped inside the basic-pitch==0.4.0 wheel from PyPI"
    license: "Apache-2.0 (Spotify AB)"
    url: "https://github.com/spotify/basic-pitch"
    approved: false

  - id: bouzouki_synth
    description: "Synthetic MIDI phrases (bouzouki_train/phrases.py) rendered by the Karplus-Strong renderer (bouzouki_train/synth.py); own code, no third-party data"
    license: "Own work (generated by this repository's code)"
    path: "training/data/synth"
    approved: false

  - id: owner_recordings
    description: "The owner's own bouzouki recordings for training (every fret of every course, chromatic runs, random patterns, recorded to a click)"
    license: "Own recordings - all rights held by the owner"
    path: "training/data/real"
    approved: false

  - id: owner_recordings_validation
    description: "The owner's held-out recordings used only for validation (finetune.py --val-real)"
    license: "Own recordings - all rights held by the owner"
    path: "training/data/real_val"
    approved: false

  - id: impulse_responses
    description: "Impulse responses for ApplyImpulseResponse (build_dataset.py --ir-dir)"
    license: "TODO: fill in per IR collection (own measurements, CC0, ...)"
    path: "training/data/ir"
    approved: false

  # Example for a licensed sample library or SoundFont (build_dataset.py --renderer samples|soundfont
  # --renderer-source-id <id>). Uncomment and fill in only if you have one.
  # - id: my_sample_library
  #   description: "..."
  #   license: "..."          # must allow training ML models on its renders
  #   path: "training/data/samples"
  #   approved: false
