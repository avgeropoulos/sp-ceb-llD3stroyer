<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a120c">
  <title>Thermopylae</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script>
    // Engine check (ES5 only, runs before any module). DESIGN.md §2.1.
    (function () {
      var firstError = null;
      window.addEventListener('error', function (e) {
        if (!firstError) firstError = e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
      });
      window.__engineFail = function (msg) {
        var show = function () {
          var o = document.getElementById('overlay');
          if (!o) return;
          var boot = document.getElementById('boot');
          if (boot) boot.parentNode.removeChild(boot);
          o.innerHTML = '<div class="engine-fail"><h1>THERMOPYLAE</h1><p></p></div>';
          o.querySelector('p').textContent = msg;
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
        else show();
      };
      var update = 'Please update Android System WebView (or Chrome) to play.';
      try {
        new Function('class A{static{}}');
        if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) throw 0;
      } catch (e) {
        window.__engineFail(update);
        return;
      }
      // Fail only if booting stops making progress for 15 s (slow phones may take longer than that overall).
      var started = Date.now();
      var watchdog = setInterval(function () {
        if (window.__booted) {
          clearInterval(watchdog);
          return;
        }
        if (Date.now() - (window.__bootProgressAt || started) > 15000) {
          clearInterval(watchdog);
          window.__engineFail('The game failed to start. ' + (firstError ? firstError : update));
        }
      }, 1000);
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/": "./lib/three/addons/"
      }
    }
  </script>
  <link rel="modulepreload" href="./lib/three/three.core.js">
  <link rel="modulepreload" href="./lib/three/three.module.js">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="overlay"></div>
  <div id="boot">
    <div class="boot-title">THERMOPYLAE</div>
    <div class="boot-sub">480 BC</div>
    <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-msg" id="boot-msg">Sharpening the spears…</div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
