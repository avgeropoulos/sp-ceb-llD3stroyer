<script>
'use strict';
// ---------- basics ----------
const $=id=>document.getElementById(id);
const KEY='makermargin.v1',DAY=864e5,EPS=1e-9,FREE={materials:20,products:5};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const dict=()=>Object.create(null);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtDate=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'–';
const MONS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const monthLabel=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7)-1,1).toLocaleDateString(undefined,{month:'short',year:'numeric'});

// Units convert to a base of g, ml or each. Maths stays unrounded; only display rounds.
const UNITS={g:['w',1],kg:['w',1000],oz:['w',28.349523125],lb:['w',453.59237],ml:['v',1],l:['v',1000],'fl oz':['v',29.5735295625],cup:['v',236.5882365],tbsp:['v',14.78676478],tsp:['v',4.92892159],each:['c',1],dozen:['c',12]};
const FAMS={w:'Weight',v:'Volume',c:'Count'};
const isUnit=u=>typeof u==='string'&&Object.hasOwn(UNITS,u);
const fam=u=>(isUnit(u)?UNITS[u]:UNITS.each)[0];
const base=u=>(isUnit(u)?UNITS[u]:UNITS.each)[1];
const unitsIn=f=>Object.keys(UNITS).filter(u=>UNITS[u][0]===f);
const SMALLER={lb:'oz',kg:'g',l:'ml',dozen:'each'};
const defUnit=u=>SMALLER[u]||u;

// Accepts "1,234.50", "1,5", "$3.12", "-$3.12", "(3.12)" and "--" (zero for money).
function parseNum(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  let s=String(v??'').trim().replace(/[\s '’]/g,'');
  if(!s)return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/^[^\d]*-/.test(s)||/-$/.test(s))neg=true;
  s=s.replace(/[^\d.,]/g,'');
  if(!/\d/.test(s))return NaN;
  if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(s.includes(',')){const p=s.split(',');s=p.length===2&&!(p[1].length===3&&p[0]!==''&&p[0]!=='0')?p.join('.'):p.join('')}
  if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?(neg?-n:n):NaN;
}
const money0=v=>{const n=parseNum(v);return isFinite(n)?n:0};
const fmtQ=n=>{n=+n||0;return n.toLocaleString(undefined,{maximumFractionDigits:Math.abs(n)<1&&n!==0?3:2})};
const fmtIn=n=>n==null||!isFinite(n)?'':String(Math.round(n*1e6)/1e6);

function lineCost(l){const m=matById(l.matId);return m?l.qty*base(lineUnit(l,m))*perBase(m)*(1+l.waste/100):0}
function costs(p){
  const y=p.yield>0?p.yield:1;let batch=0,item=0;
  for(const l of p.lines){const c=lineCost(l);if(l.per==='unit')item+=c;else batch+=c}
  const materials=batch/y+item,hourly=p.hourly==null?D.settings.hourly:p.hourly,labour=p.laborMin/60*hourly/y,overhead=(materials+labour)*D.settings.overheadPct/100;

    <p class="muted" style="margin:0">Pick one to load example materials and a sample product. You will see a real cost per unit in about two minutes, then swap in your own prices.</p>
    <div class="chips">${Object.entries(KITS).map(([k,v])=>`<button class="chip" data-act="kit" data-kit="${k}">${esc(v.label)}</button>`).join('')}<button class="chip alt" data-act="scratch">Start from scratch</button></div></section>
  <section class="card"><ol class="steps">
    <li><b>Add what you buy</b>Pack price and size. MakerMargin works out the cost per gram, ounce or piece.</li>
    <li><b>Build a recipe</b>What goes into one batch, plus waste, labour and overhead.</li>
    <li><b>Price it and see what you keep</b>Wholesale and retail suggestions, Etsy fees and your real profit.</li></ol></section>`;
}
function productCard(p){
  const c=costs(p),e=etsyCalc(p),has=p.price>0;
  return `<a class="pcard" href="#product=${esc(p.id)}" data-pid="${esc(p.id)}"><div class="pc-top"><div class="pc-name"><b>${esc(p.name)}</b>${p.sku?`<span class="muted small">${esc(p.sku)}</span>`:''}</div>${has?badge(e.margin):'<span class="mb">No price yet</span>'}</div>
    <div class="pc-stats"><div><span>Cost / unit</span><b class="n">${money(c.unit)}</b></div><div><span>Your price</span><b class="n">${has?money(p.price):'–'}</b></div><div><span>Etsy net</span><b class="n">${has?money(e.net):'–'}</b></div></div></a>`;
}
function renderPList(){
  const box=$('plist');if(!box)return;const q=ui.q.trim().toLowerCase();
  const list=D.products.filter(p=>!q||(p.name+' '+p.sku).toLowerCase().includes(q));
  box.innerHTML=list.length?`<div class="plist">${list.map(productCard).join('')}</div>`:
    D.products.length?`<div class="card empty"><p>No products match “${esc(ui.q)}”.</p></div>`:
    `<div class="card empty"><p>No products yet. Add one and build its recipe from your materials.</p><button data-act="newProduct">+ New product</button></div>`;
}
function renderProducts(v){
  if(!hasData()){v.innerHTML=firstRunHtml();return}
  const isPro=pro.isPro(),n=D.products.length;
  v.innerHTML=`<div class="toolbar"><div class="count${!isPro&&n>=FREE.products?' full':''}" id="pCount">${isPro?plural(n,'product'):`${n} of ${FREE.products} products (free)`}</div>
    <input type="search" id="q" placeholder="Search products" value="${esc(ui.q)}" aria-label="Search products"><button data-act="newProduct">+ New product</button></div>
    <div id="plist"></div>
    <div class="btns noprint" style="margin-top:14px"><button class="ghost" data-act="lineSheet" data-pro>Print price list / line sheet <span class="pro-badge hide-pro">PRO</span></button></div>
    ${ui.lineSheet&&isPro?lineSheetForm():''}`;
  renderPList();
}
function lineSheetForm(){
  return `<section class="card" id="lsForm" style="margin-top:12px"><h3>Price list / wholesale line sheet</h3>
    <div class="grid3"><div><label for="lsType">Sheet</label><select id="lsType"><option value="line">Wholesale line sheet (wholesale + MSRP)</option><option value="price">Retail price list</option></select></div>
    <div><label for="lsBiz">Business name</label><input id="lsBiz" data-set="business" value="${esc(D.settings.business)}" maxlength="80" placeholder="Your shop name"></div>
    <div><label for="lsMin">Minimum order (optional)</label><input id="lsMin" maxlength="120" placeholder="e.g. $150, or 6 per design"></div></div>
    <div class="btns" style="margin-top:12px"><button data-act="printLS">Print</button><button class="ghost" data-act="closeLS">Close</button></div></section>`;
}
function newProduct(name){
  if(!pro.isPro()&&D.products.length>=FREE.products){gate(R.cap);return null}
  const p={id:uid(),name,sku:'',yield:1,lines:[],laborMin:0,hourly:null,price:0,shipCharge:0};
  D.products.push(p);save();return p;
}
function addKit(slug){
  const k=KITS[slug];if(!k)return null;
  const find=(name,unit)=>D.materials.find(x=>x.name.toLowerCase()===name.toLowerCase()&&fam(x.packUnit)===fam(unit));
  const fresh=k.mats.filter(m=>!find(m[0],m[3])).length;
  if(!pro.isPro()&&(D.materials.length+fresh>FREE.materials||D.products.length>=FREE.products)){gate(R.cap);return null}
  const now=Date.now();
  const ids=k.mats.map(([name,price,size,unit])=>{let m=find(name,unit);if(!m){m={id:uid()+D.materials.length,name,supplier:'',packPrice:price,packSize:size,packUnit:unit,updated:now,example:true,history:[]};D.materials.push(m)}return m.id});
  const kp=k.product,p={id:uid()+'p',name:kp.name,sku:D.products.some(x=>x.sku===kp.sku)?'':kp.sku,yield:kp.yield,laborMin:kp.laborMin,hourly:null,price:kp.price,shipCharge:0,
    lines:kp.lines.map(([i,qty,unit,per,waste])=>({matId:ids[i],qty,unit,per,waste:waste||0}))};
  D.products.push(p);save();return p;
}
function loadKit(slug){const p=addKit(slug);if(!p)return;toast(`${KITS[slug].label} starter kit added. Example prices, replace with yours.`);ui.focus=null;go('product='+p.id)}

// ---------- product editor ----------

  v.innerHTML=`<div class="ed-head"><a href="#products" class="back noprint" aria-label="Back to products">← Products</a><h2 id="edTitle">${esc(p.name)}</h2></div>
  ${example?`<div class="note noprint" id="exampleNote">Example prices, replace with yours. <a href="#materials">Edit materials</a></div>`:''}

      <div class="card"><div class="label">Cost per unit</div><div id="rCost"></div><div id="rBar"></div>
        <details class="how"><summary>How is this calculated?</summary><div id="rHow"></div></details></div>
      <div class="card"><h3>Suggested prices</h3><div id="rSug"></div>
        <div class="row" style="margin-top:12px"><div><label for="pPrice">Your price</label><input id="pPrice" data-pf="price" inputmode="decimal" value="${p.price?fmtMoneyIn(p.price):''}" placeholder="0.00"></div>
        <div><label for="pShip">Shipping you charge</label><input id="pShip" data-pf="shipCharge" inputmode="decimal" value="${p.shipCharge?fmtMoneyIn(p.shipCharge):''}" placeholder="0.00"></div></div>
        <div class="whatif"><label for="pSlide">What if I charged… (1× to 6× cost)</label><input type="range" id="pSlide" min="1" max="6" step="0.05" value="2"><div id="rWhat"></div></div></div>
      <div class="card" id="etsyCard"><h3>On Etsy you keep</h3><div id="rEtsy"></div>
        <label class="check"><input type="checkbox" id="pAds"${E.useExtra?' checked':''}> Include Offsite Ads (${fmtQ(E.extraPct)}%)</label></div>
      <div class="card" id="chCard"><h3>Every channel <span class="pro-badge hide-pro">PRO</span></h3><div id="rCh"></div></div>
    </aside>
    <section class="card ed-recipe"><h3>What goes into it</h3><div id="lines"></div>
      <button class="ghost" data-act="addLine" style="margin-top:4px">+ Add material</button><div id="inlineMat"></div></section>
    <section class="card ed-labour"><h3>Labour</h3><div class="grid3">
      <div><label for="pLabor">Minutes per batch</label><input id="pLabor" data-pf="laborMin" inputmode="decimal" value="${p.laborMin?fmtIn(p.laborMin):''}" placeholder="0"></div>
      <div><label for="pHourly">Hourly rate (${esc(cur())})</label><input id="pHourly" data-pf="hourly" inputmode="decimal" value="${p.hourly==null?'':fmtIn(p.hourly)}" placeholder="${fmtIn(S.hourly)} (default)"></div></div>

function renderLines(p){
  const box=$('lines');if(!box)return;
  const mats=[...D.materials].sort((a,b)=>a.name.localeCompare(b.name));
  box.innerHTML=p.lines.length?`<div class="lines-head" aria-hidden="true"><span>Material</span><span>Qty</span><span>Unit</span><span>Per</span><span>Waste</span><span class="n">Cost</span><span></span></div>`+
    p.lines.map((l,i)=>{const m=matById(l.matId),units=m?unitsIn(fam(m.packUnit)):Object.keys(UNITS);if(m&&!units.includes(l.unit))l.unit=defUnit(m.packUnit);
      return `<div class="line" data-i="${i}">
      <select class="l-mat" data-lf="matId" aria-label="Material">${m?'':'<option value="">Choose material…</option>'}${mats.map(x=>`<option value="${esc(x.id)}"${x.id===l.matId?' selected':''}>${esc(x.name)}</option>`).join('')}<option value="__new">+ New material…</option></select>
      <input class="l-qty" data-lf="qty" inputmode="decimal" value="${fmtIn(l.qty)}" aria-label="Quantity">
      <select class="l-unit" data-lf="unit" aria-label="Unit">${units.map(u=>`<option${u===l.unit?' selected':''}>${esc(u)}</option>`).join('')}</select>
      <select class="l-per" data-lf="per" aria-label="Per batch or per item"><option value="batch"${l.per==='batch'?' selected':''}>Per batch</option><option value="unit"${l.per==='unit'?' selected':''}>Per item</option></select>
      <label class="l-waste"><input data-lf="waste" inputmode="decimal" value="${l.waste?fmtIn(l.waste):''}" placeholder="0" aria-label="Waste %"><span>%</span></label>
      <span class="l-cost n" data-lc>${money(lineCost(l))}</span>
      <button type="button" class="ghost l-x" data-act="rmLine" aria-label="Remove line">✕</button></div>`}).join(''):
    `<p class="muted small" style="margin:0 0 8px">Nothing yet. Add the materials that go into one batch (or one item).</p>`;
}
function updateEditor(p){
  if(!p||!$('rCost'))return;
  const S=D.settings,c=costs(p),s=sugg(c),E=chById('etsy'),e=etsyCalc(p);
  $('edTitle').textContent=p.name||'Untitled product';
  $('rCost').innerHTML=money(c.unit);
  const tot=c.unit>0?c.unit:1,w=x=>Math.max(0,x/tot*100).toFixed(2)+'%';
  $('rBar').innerHTML=`<div class="bar" aria-hidden="true"><span class="b-mat" style="width:${w(c.materials)}"></span><span class="b-lab" style="width:${w(c.labour)}"></span><span class="b-ovh" style="width:${w(c.overhead)}"></span></div>
    <ul class="legend"><li><i class="b-mat"></i>Materials<b id="rMat">${money(c.materials)}</b></li><li><i class="b-lab"></i>Labour<b id="rLab">${money(c.labour)}</b></li><li><i class="b-ovh"></i>Overhead<b id="rOvh">${money(c.overhead)}</b></li></ul>`;
  $('rHow').innerHTML=`<ol class="how-list">
    <li><b>Line cost</b> = quantity × (pack price ÷ pack size) × (1 + waste %), after converting units.</li>
    <li><b>Materials per unit</b> = per-batch lines ${money(c.batch)} ÷ ${fmtQ(c.y)} units + per-item lines ${money(c.item)} = ${money(c.materials)}</li>
    <li><b>Labour per unit</b> = ${fmtQ(p.laborMin)} min ÷ 60 × ${money(c.hourly)}/h ÷ ${fmtQ(c.y)} = ${money(c.labour)}</li>
    <li><b>Overhead</b> = (materials + labour) × ${fmtQ(S.overheadPct)}% = ${money(c.overhead)}</li>
    <li><b>Cost per unit</b> = materials + labour + overhead = ${money(c.unit)}</li>
    <li><b>Wholesale</b> = cost × ${fmtQ(S.wholesaleX)}; <b>retail</b> = cost × ${fmtQ(S.wholesaleX)} × ${fmtQ(S.retailX)}, each rounded up${S.ending==='none'?' to the cent':' to end in '+esc(S.ending)}.</li>
    <li><b>Etsy fees</b> = ${money(E.listing)} listing + ${fmtQ(E.txPct)}% transaction + ${fmtQ(E.procPct)}% processing on (price + shipping) + ${money(E.fixed)}${E.useExtra?` + ${fmtQ(E.extraPct)}% Offsite Ads`:''}. Processing charged on sales tax is ignored.</li>
    <li><b>Net profit</b> = price − fees − cost per unit. Shipping you charge is assumed to cover postage.</li>
    <li><b>Margin</b> = net ÷ price. <b>Profit per hour</b> = net × units per batch ÷ hours per batch.</li></ol>`;
  $('rSug').innerHTML=[['Wholesale',`cost × ${fmtQ(S.wholesaleX)}`,s.wholesale,'sugW'],['Retail',`wholesale × ${fmtQ(S.retailX)}`,s.retail,'sugR'],['3× cost','quick check',s.triple,'sug3']]
    .map(([l,h,val,id])=>`<div class="sug"><div><b>${l}</b><small class="muted">${h}</small></div><span class="n" id="${id}">${money(val)}</span><button type="button" class="ghost sm" data-act="usePrice" data-v="${val}" aria-label="Use ${l.toLowerCase()} price">Use</button></div>`).join('');
  const sl=$('pSlide');sl.disabled=!(c.unit>0);
  if(document.activeElement!==sl&&c.unit>0)sl.value=Math.min(6,Math.max(1,(p.price||s.retail)/c.unit));
  whatIf(p);
  $('rEtsy').innerHTML=!(p.price>0)?`<p class="muted" style="margin:0">Enter your price, or tap <b>Use</b> on a suggestion, to see your Etsy fees and profit.</p>`:
    `<table class="kv"><tr><td>Your price${p.shipCharge>0?' + shipping':''}</td><td class="n">${money(e.price+e.ship)}</td></tr>
    <tr><td>Listing fee</td><td class="n" id="fListing">${neg(e.f.listing)}</td></tr>
    <tr><td>Transaction fee (${fmtQ(E.txPct)}%)</td><td class="n" id="fTx">${neg(e.f.tx)}</td></tr>
    <tr><td>Payment processing (${fmtQ(E.procPct)}% + ${money(E.fixed)})</td><td class="n" id="fProc">${neg(e.f.proc)}</td></tr>
    ${E.useExtra?`<tr><td>Offsite Ads (${fmtQ(E.extraPct)}%)</td><td class="n" id="fAds">${neg(e.f.extra)}</td></tr>`:''}
    <tr class="sub"><td>Total Etsy fees</td><td class="n" id="fTotal">${money(e.f.total)}</td></tr>
    ${p.shipCharge>0?`<tr><td>Postage (covered by shipping)</td><td class="n">${neg(e.ship)}</td></tr>`:''}
    <tr><td>Cost per unit</td><td class="n">${neg(c.unit)}</td></tr>
    <tr class="total"><td>Net profit per sale</td><td class="n" id="fNet">${money(e.net)}</td></tr>
    <tr><td>Margin</td><td class="n" id="fMargin">${badge(e.margin)}</td></tr>
    <tr><td>Profit per hour of labour</td><td class="n" id="fPph">${e.pph==null?'–':money(e.pph)+'/h'}</td></tr></table>`;
  $('rCh').innerHTML=pro.isPro()?chanTable(p):lockedRows(['Channel','Price','Fees','Net','Margin'],
    [['Shopify',money(24),money(1),money(16.71),'69.6%'],['Craft fair',money(24),money(.77),money(16.93),'70.5%']],'ch');
  document.querySelectorAll('#lines .line').forEach(el=>{const l=p.lines[+el.dataset.i];if(l)el.querySelector('[data-lc]').innerHTML=money(lineCost(l))});
}
function whatIf(p){
  const c=costs(p),sl=$('pSlide'),box=$('rWhat');if(!sl||!box)return;
  if(!(c.unit>0)){box.innerHTML='<span class="muted small">Add materials or labour first.</span>';return}
  const price=Math.round(c.unit*sl.value*100)/100,e=etsyCalc(p,price);
  box.innerHTML=`<span>At <b>${money(price)}</b> (${(+sl.value).toFixed(2)}× cost) you keep <b id="wNet">${money(e.net)}</b> on Etsy · ${badge(e.margin)}</span><button type="button" class="ghost sm" data-act="usePrice" data-v="${price}">Use ${money(price)}</button>`;
}
function chanTable(p){
  const T=D.settings.targetMargin;
  return `<table class="stack chtab"><thead><tr><th>Channel</th><th class="n">Price</th><th class="n">Fees</th><th class="n">Net</th><th class="n">Margin</th></tr></thead><tbody>${chanRows().map(r=>{
    const x=calc(p,r.ch,undefined,r.ads),below=x.margin*100<T-1e-9;
    return `<tr data-ch="${esc(r.id)}"${below?' class="below"':''}><td class="lead" data-label="">${esc(r.label)}${r.ch.basis==='wholesale'?' <small class="muted">(wholesale price)</small>':''}${below?' <small>below target</small>':''}</td>
      <td class="n" data-label="Price">${money(x.price)}</td><td class="n c-fee" data-label="Fees"><span>${money(x.f.total)}${x.f.minApplied?' <small>(min)</small>':''}</span></td><td class="n c-net" data-label="Net">${money(x.net)}</td><td class="n" data-label="Margin">${pct(x.margin)}</td></tr>`}).join('')}</tbody></table>
    <p class="hint">Rows in red are below your ${fmtQ(T)}% target margin. Retail channels use your price; wholesale uses the suggested wholesale price. <a href="#fees">Edit channels</a></p>`;
}
function lockedRows(head,rows,why){
  return `<div class="blurwrap" aria-hidden="true"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="n"':''}>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <button data-act="unlock" data-why="${why}">Unlock with Pro</button>`;
}
function setPF(p,k,raw){
  if(k==='name')p.name=String(raw).slice(0,120);
  else if(k==='sku')p.sku=String(raw).trim().slice(0,64);
  else if(k==='hourly'){const n=parseNum(raw);p.hourly=String(raw).trim()===''||!isFinite(n)?null:Math.min(1e5,Math.max(0,n))}
  else{const n=parseNum(raw),val=isFinite(n)?Math.min(1e9,Math.max(0,n)):0;
    if(k==='yield'){if(!(val>0))return;p.yield=val}else if(['laborMin','price','shipCharge'].includes(k))p[k]=val}
  save();updateEditor(p);
}
function lineSelect(p,t){
  const i=+t.closest('.line').dataset.i,l=p.lines[i];if(!l)return;const k=t.dataset.lf;
  if(k==='matId'){
    if(t.value==='__new'){t.value=l.matId||'';openInlineMat(i);return}
    const m=matById(t.value),prev=matById(l.matId);if(!m)return;
    l.matId=m.id;if(!prev||fam(l.unit)!==fam(m.packUnit))l.unit=defUnit(m.packUnit);
    save();renderLines(p);updateEditor(p);return;
  }
  if(k==='unit'&&isUnit(t.value))l.unit=t.value;
  if(k==='per')l.per=t.value==='unit'?'unit':'batch';
  save();updateEditor(p);
}
function openInlineMat(i){
  if(!pro.isPro()&&D.materials.length>=FREE.materials){gate(R.cap);return}
  ui.inlineMat={line:i};$('inlineMat').innerHTML=matFormHtml(null,'inline');
  const f=$('inlineMat').querySelector('input[name=name]');if(f)f.focus();
}

// ---------- materials ----------
function matFormHtml(m,ctx){
  const v=m||{name:'',supplier:'',packPrice:'',packSize:'',packUnit:'each'};
  return `<form class="matform" data-form="mat" data-ctx="${ctx}"${m?` data-id="${esc(m.id)}"`:''} novalidate><h3>${m?'Edit material':'New material'}</h3>
    <div class="grid2" style="margin-bottom:10px"><div><label for="mf_${ctx}_name">Name</label><input id="mf_${ctx}_name" name="name" maxlength="120" value="${esc(v.name)}" placeholder="e.g. Soy wax" autocomplete="off"></div>
    <div><label for="mf_${ctx}_sup">Supplier (optional)</label><input id="mf_${ctx}_sup" name="supplier" maxlength="120" value="${esc(v.supplier)}" autocomplete="off"></div></div>
    <div class="grid3"><div><label for="mf_${ctx}_price">Pack price (${esc(cur())})</label><input id="mf_${ctx}_price" name="packPrice" inputmode="decimal" value="${m?fmtMoneyIn(v.packPrice):''}" placeholder="32.00"></div>
    <div><label for="mf_${ctx}_size">Pack size</label><input id="mf_${ctx}_size" name="packSize" inputmode="decimal" value="${m?fmtIn(v.packSize):''}" placeholder="10"></div>
    <div><label for="mf_${ctx}_unit">Unit</label><select id="mf_${ctx}_unit" name="packUnit">${unitOptions(v.packUnit)}</select></div></div>
    <p class="hint" data-preview>${m?matPreviewText(v.packPrice,v.packSize,v.packUnit):'Enter what you pay for one pack, e.g. 32.00 for 10 lb.'}</p><p class="err" data-err role="alert"></p>
    <div class="btns"><button type="submit">Save material</button><button type="button" class="ghost" data-act="cancelMat">Cancel</button></div></form>`;
}
function matPreviewText(price,size,unit){
  if(!(price>=0)||!(size>0)||!isUnit(unit))return 'Enter what you pay for one pack, e.g. 32.00 for 10 lb.';
  const show=defUnit(unit);return `= ${moneyU(price/(size*base(unit))*base(show))} per ${esc(show)}`;
}
function matPreview(f){const g=n=>f.elements[n].value;f.querySelector('[data-preview]').innerHTML=matPreviewText(parseNum(g('packPrice')),parseNum(g('packSize')),g('packUnit'))}
function saveMatForm(f){
  const g=n=>String(f.elements[n].value||'').trim();
  const name=g('name').slice(0,120),supplier=g('supplier').slice(0,120),price=parseNum(g('packPrice')),size=parseNum(g('packSize')),unit=f.elements.packUnit.value;
  const err=!name?'Give the material a name.':!(price>=0)?'Enter the pack price, for example 32.00.':!(size>0)?'Enter the pack size, for example 10.':!isUnit(unit)?'Pick a unit.':'';
  if(err){f.querySelector('[data-err]').textContent=err;return}
  const id=f.dataset.id,inline=f.dataset.ctx==='inline';
  if(id){
    const m=matById(id);if(!m)return;
    const users=usersOf(id),before=new Map(users.map(p=>[p.id,costs(p).unit]));
    const changed=price!==m.packPrice||size!==m.packSize||unit!==m.packUnit,famChanged=fam(unit)!==fam(m.packUnit);
    const old={packPrice:m.packPrice,packSize:m.packSize,packUnit:m.packUnit};

// ---------- profit (Pro): CSV parsing and import ----------
function parseCSV(text){
  text=String(text);if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const first=text.slice(0,text.search(/\r|\n|$/)),sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function parseDate(s){
  s=String(s||'').trim();let m,y,mo,d;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))[y,mo,d]=[+m[1],+m[2],+m[3]];
  else if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})\b/))){mo=+m[1];d=+m[2];y=+m[3];if(y<100)y+=2000}
  else if((m=s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/))){mo=MONS.indexOf(m[1].slice(0,3).toLowerCase())+1;d=+m[2];y=+m[3]}
  else if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s+(\d{4})\b/))){d=+m[1];mo=MONS.indexOf(m[2].slice(0,3).toLowerCase())+1;y=+m[3]}
  else return null;
  return y>=1990&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=31?{y,mo,d,ym:`${y}-${pad(mo)}`}:null;
}
const normH=h=>String(h).toLowerCase().replace(/[\s_]+/g,'');
const SALES_F=[['date','Sale Date',1],['name','Item Name',1],['qty','Quantity',1],['total','Item Total',1],['order','Order ID'],['sku','SKU'],['listing','Listing ID'],['ship','Order Shipping'],['disc','Discount Amount'],['tax','Order Sales Tax'],['cur','Currency']];
const STMT_F=[['date','Date',1],['type','Type',1],['title','Title',1],['amount','Amount',1],['fees','Fees & Taxes',1],['net','Net']];
const FIELD_NAMES={date:'Date',name:'Item name',qty:'Quantity',total:'Item total',type:'Type',title:'Title',amount:'Amount',fees:'Fees & Taxes'};
function autoMap(headers,F){const n=headers.map(normH),m={};for(const [k,label] of F){const i=n.indexOf(normH(label));if(i>=0)m[k]=i}return m}
function detect(headers){
  const s=autoMap(headers,SALES_F),t=autoMap(headers,STMT_F),score=(m,F)=>F.reduce((a,f)=>a+(m[f[0]]!=null?(f[2]?2:1):0),0);
  return score(t,STMT_F)>score(s,SALES_F)?{type:'stmt',map:t}:{type:'sales',map:s};
}
const missing=(type,map)=>(type==='stmt'?STMT_F:SALES_F).filter(f=>f[2]&&map[f[0]]==null);
const normName=s=>String(s).toLowerCase().replace(/\s+/g,' ').trim();
function rangeLabel(yms){return monthLabel(yms[0])+(yms.length>1?' – '+monthLabel(yms[yms.length-1]):'')}
function importSales(map,rows){
  const E=chById('etsy'),lines=dict(),months=dict(),orders=new Map();let n=0,bad=0;
  for(let r=1;r<rows.length;r++){
    const row=rows[r],get=k=>map[k]!=null?String(row[map[k]]??'').trim():'';
    const d=parseDate(get('date'));if(!d){bad++;continue}
    const qn=parseNum(get('qty')),q=isFinite(qn)?qn:0,total=money0(get('total')),disc=Math.abs(money0(get('disc')));
    const name=get('name').slice(0,200)||'(no item name)',sku=get('sku').slice(0,64),key=(sku?'sku:'+sku:'name:'+normName(name)).slice(0,250),lk=d.ym+'|'+key;
    const L=lines[lk]||(lines[lk]={name,sku,units:0,items:0,disc:0});L.units+=q;L.items+=total;L.disc+=disc;

  const yms=Object.keys(months).sort();if(!yms.length)return `No sales rows with a readable date were found${bad?` (${bad} rows skipped)`:''}.`;
  for(const k of Object.keys(D.sales.lines))if(months[k.slice(0,7)])delete D.sales.lines[k];

function importStmt(map,rows){
  const st=dict();let n=0,bad=0;
  for(let r=1;r<rows.length;r++){
    const row=rows[r],get=k=>map[k]!=null?String(row[map[k]]??'').trim():'';
    const d=parseDate(get('date'));if(!d){bad++;continue}
    const type=get('type').toLowerCase(),title=get('title'),amt=money0(get('amount')),fee=money0(get('fees'));
    const S=st[d.ym]||(st[d.ym]={fees:0,ads:0,postage:0,refunds:0,tax:0,other:0,otherCount:0});n++;
    if(type==='sale'||type==='deposit'||type==='payment')continue;
    if(type==='refund'){S.refunds+=Math.abs(amt!==0?amt:fee);if(amt!==0&&fee>0)S.fees-=fee;continue}
    const signed=fee!==0?fee:amt,v=Math.abs(signed),credit=signed>0&&/credit|refund/i.test(title)?-1:1;
    const b=type==='fee'?(/offsite ads/i.test(title)?'ads':'fees'):type==='marketing'?'ads':type==='shipping'?'postage':type==='tax'?'tax':null;
    if(b)S[b]+=credit*v;else{S.other+=v;S.otherCount++}
  }
  const yms=Object.keys(st).sort();if(!yms.length)return `No statement rows with a readable date were found${bad?` (${bad} rows skipped)`:''}.`;
  for(const k of yms)D.sales.statement[k]=st[k];
  ui.year=yms[yms.length-1].slice(0,4);
  return `Imported statement (${n} line${n===1?'':'s'}) for ${rangeLabel(yms)}`;
}
const runImport=(type,map,rows)=>type==='stmt'?importStmt(map,rows):importSales(map,rows);
async function importFiles(files){

    if(f.size>25e6){msgs.push(`${f.name} is too large`);continue}

function listings(){
  const by=new Map();
  for(const k of Object.keys(D.sales.lines)){const key=k.slice(8),l=D.sales.lines[k];const x=by.get(key)||{key,name:l.name,sku:l.sku,units:0};x.units+=l.units;by.set(key,x)}
  for(const x of by.values()){
    const v=D.sales.map[x.key];
    if(v==='ignore'||(v&&prodById(v))){x.pid=v;x.auto=false;continue}
    const s=x.sku.trim().toLowerCase(),nm=x.name.trim().toLowerCase();
    const p=(s&&D.products.find(p=>p.sku&&p.sku.trim().toLowerCase()===s))||D.products.find(p=>p.name.trim().toLowerCase()===nm);
    x.pid=p?p.id:null;x.auto=!!p;

function report(Y){
  const eff=new Map(listings().map(x=>[x.key,x])),unitCost=new Map(),uc=p=>{if(!unitCost.has(p.id))unitCost.set(p.id,costs(p).unit);return unitCost.get(p.id)};
  const ms=new Set([...Object.keys(D.sales.months),...Object.keys(D.sales.statement)].filter(k=>k.startsWith(Y+'-')));
  const months=[...ms].sort().map(ym=>({ym,units:0,items:0,disc:0,cogs:0}));const byYm=new Map(months.map(m=>[m.ym,m]));
  const lines=Object.keys(D.sales.lines).filter(k=>byYm.has(k.slice(0,7)));
  for(const k of lines){const l=D.sales.lines[k],m=byYm.get(k.slice(0,7)),x=eff.get(k.slice(8)),p=x&&x.pid&&x.pid!=='ignore'&&prodById(x.pid);
    m.units+=l.units;m.items+=l.items;m.disc+=l.disc;if(p)m.cogs+=l.units*uc(p)}
  const tot={units:0,items:0,disc:0,sales:0,ship:0,fees:0,ads:0,postage:0,refunds:0,cogs:0,net:0,tax:0,other:0,otherCount:0,est:false};
  for(const m of months){const M=D.sales.months[m.ym]||{ship:0,tax:0,estFees:0},S=D.sales.statement[m.ym];
    Object.assign(m,{sales:m.items-m.disc,ship:M.ship,est:!S,fees:S?S.fees:M.estFees,ads:S?S.ads:0,postage:S?S.postage:0,refunds:S?S.refunds:0,tax:M.tax||(S?S.tax:0),other:S?S.other:0,otherCount:S?S.otherCount:0});
    m.net=m.sales+m.ship-m.fees-m.ads-m.postage-m.refunds-m.cogs;
    for(const k of Object.keys(tot))if(k!=='est')tot[k]+=m[k];if(m.est&&m.fees)tot.est=true}
  const prods=new Map();
  for(const k of lines){const l=D.sales.lines[k],m=byYm.get(k.slice(0,7)),key=k.slice(8),x=eff.get(key),p=x&&x.pid&&x.pid!=='ignore'&&prodById(x.pid);
    const g=p?'p:'+p.id:(x&&x.pid==='ignore'?'i:':'u:')+key,sales=l.items-l.disc,share=m.sales>0?sales/m.sales:0;
    const G=prods.get(g)||{label:p?p.name:l.name,kind:p?'product':x&&x.pid==='ignore'?'ignored':'unmatched',units:0,sales:0,cogs:0,fees:0};

  products.forEach(g=>g.perUnit=g.units?g.profit/g.units:0);
  return{year:Y,months,tot,products,gross:tot.items+tot.ship-tot.disc};
}

function yearSheet(){
  const r=report(ui.year),M=money;
  return `<div class="sh">${sheetHead(`${r.year} profit summary`,`Etsy sales · prepared ${fmtDate(Date.now())}`)}
    <table><tbody><tr><td>Gross sales (items + shipping charged − discounts)</td><td class="n">${M(r.gross)}</td></tr><tr><td>Refunds</td><td class="n">${neg(r.tot.refunds)}</td></tr><tr><td>Etsy fees${r.tot.est?' (partly estimated)':''}</td><td class="n">${neg(r.tot.fees)}</td></tr><tr><td>Advertising</td><td class="n">${neg(r.tot.ads)}</td></tr><tr><td>Postage</td><td class="n">${neg(r.tot.postage)}</td></tr><tr><td>Cost of goods (units × current unit cost)</td><td class="n">${neg(r.tot.cogs)}</td></tr><tr class="total"><td>Net profit</td><td class="n">${M(r.tot.net)}</td></tr></tbody></table>
    <p>Sales tax collected and paid by Etsy: <b>${M(r.tot.tax)}</b> (not your income)</p>
    <h2>By month</h2><table class="wide"><thead><tr><th>Month</th><th class="n">Units</th><th class="n">Sales</th><th class="n">Shipping</th><th class="n">Fees</th><th class="n">Ads</th><th class="n">Postage</th><th class="n">Refunds</th><th class="n">COGS</th><th class="n">Net</th></tr></thead><tbody>
    ${[...r.months,{...r.tot,ym:null}].map(m=>`<tr${m.ym?'':' class="tot"'}><td>${m.ym?esc(monthLabel(m.ym)):'Total'}</td><td class="n">${fmtQ(m.units)}</td><td class="n">${M(m.sales)}</td><td class="n">${M(m.ship)}</td><td class="n">${M(m.fees)}${m.ym&&m.est&&m.fees?' est.':''}</td><td class="n">${M(m.ads)}</td><td class="n">${M(m.postage)}</td><td class="n">${M(m.refunds)}</td><td class="n">${M(m.cogs)}</td><td class="n">${M(m.net)}</td></tr>`).join('')}</tbody></table>
    <p class="sh-note">Estimates for planning, not tax advice. Cost of goods uses your current recipe costs.</p></div>`;
}

// ---------- events ----------
const ACT={
  kit:a=>loadKit(a.dataset.kit),
  addKit:a=>{ui.kitOffer=null;loadKit(a.dataset.kit);renderNotice()},
  dismissKit:()=>{ui.kitOffer=null;renderNotice()},
  scratch:()=>{const p=newProduct('My first product');if(p){ui.focus='pName';go('product='+p.id)}},
  newProduct:()=>{const p=newProduct('New product');if(p){ui.focus='pName';go('product='+p.id)}},
  dup:()=>{const p=prodById(ui.edit);if(!p)return;if(!pro.isPro()&&D.products.length>=FREE.products){gate(R.cap);return}
    const c=JSON.parse(JSON.stringify(p));c.id=uid()+'d';c.name=(p.name+' (copy)').slice(0,120);c.sku='';D.products.push(c);save();ui.focus='pName';go('product='+c.id);toast('Duplicated. Rename it and change what differs.')},
  delProduct:()=>{const p=prodById(ui.edit);if(!p||!confirm(`Delete “${p.name}”? This cannot be undone.`))return;
    D.products=D.products.filter(x=>x!==p);D.plan.rows=D.plan.rows.filter(r=>r.productId!==p.id);save();go('products');toast(`Deleted ${p.name}.`)},
  printCost:()=>{const p=prodById(ui.edit);if(p)printSheet(costSheet(p))},
  addLine:()=>{const p=prodById(ui.edit);if(!p)return;p.lines.push({matId:'',qty:1,unit:'each',per:'batch',waste:0});save();renderLines(p);updateEditor(p);
    if(!D.materials.length){openInlineMat(p.lines.length-1);return}const s=document.querySelector('#lines .line:last-child .l-mat');if(s)s.focus()},
  rmLine:a=>{const p=prodById(ui.edit);if(!p)return;p.lines.splice(+a.closest('.line').dataset.i,1);save();renderLines(p);updateEditor(p)},
  usePrice:a=>{const p=prodById(ui.edit);if(!p)return;p.price=Math.max(0,+a.dataset.v||0);save();$('pPrice').value=fmtMoneyIn(p.price);updateEditor(p)},
  newMat:()=>{if(!pro.isPro()&&D.materials.length>=FREE.materials){gate(R.cap);return}ui.matForm='new';ui.matErr='';ui.ripple=null;ui.teaser=0;ui.focus='mf_tab_name';render()},
  editMat:a=>{ui.matForm=a.dataset.id;ui.matErr='';ui.ripple=null;ui.teaser=0;ui.focus='mf_tab_price';render();const f=document.querySelector('form[data-form=mat]');if(f)f.scrollIntoView({block:'nearest'})},
  cancelMat:a=>{if(a.closest('form').dataset.ctx==='inline'){ui.inlineMat=null;$('inlineMat').innerHTML=''}else{ui.matForm=null;render()}},
  delMat:a=>{const m=matById(a.dataset.id);if(!m)return;const users=usersOf(m.id);
    if(users.length){ui.matErr=`<div class="warnbox" role="alert" id="matErr">“${esc(m.name)}” is used in ${users.map(p=>`<a href="#product=${esc(p.id)}">${esc(p.name)}</a>`).join(', ')}. Remove it from ${users.length===1?'that product':'those products'} before deleting it.</div>`;render();return}
    if(!confirm(`Delete “${m.name}”?`))return;D.materials=D.materials.filter(x=>x!==m);ui.matErr='';if(ui.matForm===m.id)ui.matForm=null;save();render()},
  closeRipple:()=>{ui.ripple=null;render()},
  unlock:a=>gate(R[a.dataset.why]||R.cap),
  getPro:()=>pro.upsell('Pay once, use it forever. Unlimited products, every-channel profit, price-change alerts, batch shopping lists and your Etsy year-end report.'),
  addCh:()=>{if(!gate(R.ch))return;const c={...CH_BLANK,id:'c_'+uid()};D.channels.push(c);save();render();ui.focus=null;const el=document.querySelector(`[data-chid="${c.id}"] .chan-name`);if(el){el.focus();el.select()}},
  delCh:a=>{const id=a.closest('[data-chid]').dataset.chid,c=chById(id);if(!c||!id.startsWith('c_')||!confirm(`Remove the “${c.name}” channel?`))return;D.channels=D.channels.filter(x=>x!==c);save();render()},
  addPlan:()=>{D.plan.rows.push({productId:(D.products[D.plan.rows.length]||D.products[0]||{}).id||'',qty:0});save();render();const q=document.querySelectorAll('[data-pl=qty]');if(q.length)q[q.length-1].focus()},
  rmPlan:a=>{D.plan.rows.splice(+a.closest('.prow').dataset.i,1);save();render()},
  printPlan:()=>printSheet(shopSheet()),
  mapImport:()=>{const m=ui.mapper[0];if(!m)return;const miss=missing(m.type,m.map);if(miss.length){toast(`Choose a column for: ${miss.map(f=>FIELD_NAMES[f[0]]).join(', ')}.`);return}
    const msg=runImport(m.type,m.map,m.rows);ui.mapper.shift();save();render();toast(msg,6000)},
  mapSkip:()=>{ui.mapper.shift();render()},
  exportCsv:()=>exportCsv(),
  printYear:()=>{if(ui.year)printSheet(yearSheet())},
  clearSales:()=>{if(!confirm('Clear all imported Etsy sales and statements? Your products and materials are kept.'))return;D.sales={lines:dict(),months:dict(),statement:dict(),map:dict()};ui.year=null;save();render()},
  backup:()=>backup(),
  later:()=>{D.settings.snooze=Date.now()+3*DAY;save();renderBanner()},
  wipe:()=>{if(!confirm('Erase all MakerMargin data in this browser? Download a backup first if you might want it back.'))return;try{localStorage.removeItem(KEY)}catch{}D=sanitize({});ui={...ui,matForm:null,ripple:null,teaser:0,mapper:[],year:null,q:''};go('products');render();toast('All data erased.')},
  lineSheet:()=>{if(!gate(R.sheet))return;ui.lineSheet=!ui.lineSheet;render();if(ui.lineSheet)$('lsForm').scrollIntoView({block:'nearest'})},
  closeLS:()=>{ui.lineSheet=false;render()},
  printLS:()=>{if(gate(R.sheet))printSheet(lineSheet($('lsType').value,$('lsMin').value.trim().slice(0,120)))},
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a,e)}});
document.addEventListener('input',e=>{
  const t=e.target;if(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='file')return;
  const p=ui.edit&&prodById(ui.edit);
  if(p&&t.dataset.pf)return setPF(p,t.dataset.pf,t.value);
  if(p&&t.dataset.lf){const l=p.lines[+t.closest('.line').dataset.i];if(!l)return;const n=parseNum(t.value);l[t.dataset.lf]=isFinite(n)?Math.min(t.dataset.lf==='waste'?500:1e9,Math.max(0,n)):0;save();updateEditor(p);return}
  if(p&&t.id==='pSlide')return whatIf(p);
  if(t.id==='q'){ui.q=t.value;renderPList();return}
  if(t.dataset.set)return setSetting(t.dataset.set,t.value);
  if(t.dataset.chf)return setChan(t);
  if(t.dataset.pl==='qty'){const r=D.plan.rows[+t.closest('.prow').dataset.i];if(r){const n=parseNum(t.value);r.qty=isFinite(n)?Math.min(1e6,Math.max(0,Math.round(n))):0;save();updatePlan()}return}
  const f=t.closest('form[data-form="mat"]');if(f)matPreview(f);
});
document.addEventListener('change',e=>{
  const t=e.target,p=ui.edit&&prodById(ui.edit);
  if(p&&t.dataset.lf&&t.tagName==='SELECT')return lineSelect(p,t);
  if(p&&t.id==='pAds'){chById('etsy').useExtra=t.checked;save();updateEditor(p);return}
  if(t.dataset.set&&t.tagName==='SELECT')return setSetting(t.dataset.set,t.value);
  if(t.dataset.chf&&(t.tagName==='SELECT'||t.type==='checkbox'))return setChan(t);
  if(t.dataset.pl==='productId'){const r=D.plan.rows[+t.closest('.prow').dataset.i];if(r&&prodById(t.value)){r.productId=t.value;save();updatePlan()}return}
  if(t.id==='planCh'){D.plan.channel=t.value;save();updatePlan();return}
  if(t.id==='mapType'){const m=ui.mapper[0];if(m){m.type=t.value==='stmt'?'stmt':'sales';m.map=autoMap(m.headers,m.type==='stmt'?STMT_F:SALES_F);$('mapper').innerHTML=mapperHtml()}return}
  if(t.dataset.map){const m=ui.mapper[0];if(m){if(t.value==='')delete m.map[t.dataset.map];else m.map[t.dataset.map]=+t.value}return}
  if(t.hasAttribute('data-mapsel')){const key=t.closest('tr').dataset.key;if(t.value==='ignore'||prodById(t.value))D.sales.map[key]=t.value;else delete D.sales.map[key];save();render();return}
  if(t.id==='yearSel'){ui.year=t.value;render();return}
  if(t.id==='csvFiles'){const fs=[...t.files];t.value='';importFiles(fs);return}
  if(t.id==='restoreFile'){const f=t.files[0];t.value='';restoreFile(f);return}
  if(t.name==='packUnit'){const f=t.closest('form[data-form="mat"]');if(f)matPreview(f);return}
  if(p&&t.dataset.pf&&!['name','sku'].includes(t.dataset.pf)){const k=t.dataset.pf,val=p[k];t.value=k==='yield'?fmtIn(val):!val?'':k==='price'||k==='shipCharge'?fmtMoneyIn(val):fmtIn(val)}
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form="mat"]');if(f){e.preventDefault();saveMatForm(f)}});
document.addEventListener('dragover',e=>{e.preventDefault();const d=e.target.closest&&e.target.closest('#drop');document.querySelectorAll('.drop').forEach(x=>x.classList.toggle('over',x===d))});
document.addEventListener('dragleave',e=>{if(e.target.closest&&e.target.closest('#drop'))e.target.closest('#drop').classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();const d=e.target.closest&&e.target.closest('#drop');if(!d)return;d.classList.remove('over');const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])].filter(f=>/\.csv$/i.test(f.name)||/csv|text/.test(f.type));if(fs.length)importFiles(fs)});

// ---------- start ----------
(function start(){
  const q=new URLSearchParams(location.search);let k=String(q.get('kit')||'').toLowerCase().trim();k=KIT_ALIAS[k]||k;
  if(q.has('kit')){
    q.delete('kit');let hash=location.hash;
    if(Object.hasOwn(KITS,k)){if(!hasData()){const p=addKit(k);if(p){hash='#product='+p.id;setTimeout(()=>toast(`${KITS[k].label} starter kit loaded. Example prices, replace with yours.`),0)}}else ui.kitOffer=k}
    history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+hash);
  }
  route();render();
})();
</script></body></html>
