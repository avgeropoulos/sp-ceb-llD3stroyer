name: Analyze songs (developer tool)

# Looks into wrong or missing notes on real recordings, with the song owner's go-ahead. For each line of
# .github/analyze-song.txt ("<YouTube link or ytsearch1:words> | <m:ss-m:ss close-up windows, comma-separated>")
# it downloads the audio on the runner, analyses it exactly as the app does, and keeps only the analysis:
# the app's song.json and song.data, and close-up spectrograms of the voice-removed sound for the windows,
# as an artifact kept for one day. The audio is deleted on the runner and never stored.
on:
  push:
    paths:
      - .github/analyze-song.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tools
        run: |
          pip install --quiet -U "yt-dlp[default]" librosa soundfile numpy
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Voice-removal model
        run: curl -sSfL -o "$RUNNER_TEMP/mdx.onnx" https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Inst_HQ_3.onnx

      - name: Build the analysis tool
        run: ./gradlew :bouzouki-core:testClasses --console=plain

      - name: Analyse each song
        run: |
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            n=$((n + 1))
            src="${line%%|*}"
            src="${src#"${src%%[![:space:]]*}"}"; src="${src%"${src##*[![:space:]]}"}"
            windows=""
            case "$line" in *"|"*) windows="${line#*|}"; windows="${windows//[[:space:]]/}" ;; esac
            d="$PWD/out/song$n"
            mkdir -p "$d"
            echo "== $src  [$windows]"
            echo "$src | $windows" > "$d/request.txt"
            case "$src" in ytsearch*) yt-dlp --flat-playlist --print "%(id)s | %(title)s | %(channel)s | %(duration_string)s" "ytsearch5:${src#*:}" > "$d/search.txt" 2>&1 || true; cat "$d/search.txt" ;; esac
            ok=0
            for client in "" "youtube:player_client=tv,web_safari" "youtube:player_client=mweb,android_vr" "youtube:player_client=web_embedded"; do
              extra=()
              [ -n "$client" ] && extra=(--extractor-args "$client")
              if yt-dlp --no-playlist -f bestaudio -x --audio-format wav \
                  --postprocessor-args "ffmpeg:-ar 44100 -ac 2 -sample_fmt s16" -o "$RUNNER_TEMP/song.%(ext)s" \
                  --print-to-file "%(id)s | %(title)s | %(channel)s | %(duration_string)s | %(webpage_url)s" "$d/info.txt" \
                  "${extra[@]}" "$src" > "$d/download.log" 2>&1; then
                ok=1; break
              fi
              tail -5 "$d/download.log"
            done
            if [ "$ok" != 1 ]; then cp "$d/download.log" "$d/error.txt"; continue; fi
            cat "$d/info.txt"
            ./gradlew :bouzouki-core:analyzeSong --console=plain -q \
              -PsongAudio="$RUNNER_TEMP/song.wav" -PsongModel="$RUNNER_TEMP/mdx.onnx" -PsongOut="$d" -PsongStem="$RUNNER_TEMP/stem.wav" \
              > "$d/analysis.log" 2>&1 || cp "$d/analysis.log" "$d/error.txt"
            tail -5 "$d/analysis.log"
            rm -f "$RUNNER_TEMP/song.wav"
            if [ -n "$windows" ] && [ -f "$RUNNER_TEMP/stem.wav" ]; then
              python .github/scripts/song_closeups.py "$RUNNER_TEMP/stem.wav" "$windows" "$d" || true
            fi
            rm -f "$RUNNER_TEMP/stem.wav"
          done < .github/analyze-song.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-analysis
          path: out/
          retention-days: 1
