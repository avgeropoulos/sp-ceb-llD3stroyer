name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test :hero-core:test --console=plain

      - name: Run bouzouki and Bouzouki Hero tests
        run: ./gradlew :bouzouki-core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build bouzouki APK
        run: ./gradlew :bouzouki:assembleDebug --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RoccosQuest.apk
          cp bouzouki/build/outputs/apk/debug/bouzouki-debug.apk Bouzouki.apk
          echo "$GITHUB_RUN_NUMBER" > bouzouki-version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RoccosQuest-apk
          path: RoccosQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bouzouki-apk
          path: Bouzouki.apk

      - name: Publish downloadable build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Rocco's Quest and Μπουζούκι - Download for Android"
          prerelease: false
          make_latest: true
          body: |
            Install on Android: download **RoccosQuest.apk** or **Bouzouki.apk** on your
            phone, open it, and allow "install unknown apps" for your browser if asked.

            **Bouzouki.apk** is the Greek bouzouki app (trichordo and tetrachordo with the dromoi),
            with the Bouzouki Hero game inside.

            Built from ${{ github.sha }}.
          files: |
            RoccosQuest.apk
            Bouzouki.apk
            bouzouki-version.txt

      # The Μπουζούκι app updates itself from this release (see bouzouki/.../Updater.kt), so only
      # this branch's builds go here, never another branch's.
      - name: Publish to the app's update channel
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'ccr-a8580b25-oh80s5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bouzouki-hero
          name: "Μπουζούκι with Bouzouki Hero - in-app updates"
          prerelease: false
          make_latest: false
          body: |
            The update channel for Μπουζούκι with Bouzouki Hero. The app's ⬆ Update button installs
            the newest build from here. To install by hand, download **Bouzouki.apk** on your phone.

            Built from ${{ github.sha }}.
          files: |
            Bouzouki.apk
            bouzouki-version.txt
