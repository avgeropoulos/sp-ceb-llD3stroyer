name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test :javelin-core:test --console=plain

      - name: Build APKs
        env:
          # Javelin Strike's version number, so the app can tell when a newer build exists.
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug :javelin-app:assembleDebug --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RoccosQuest.apk
          cp javelin-app/build/outputs/apk/debug/javelin-app-debug.apk JavelinStrike.apk
          echo "${{ github.run_number }}" > javelin-version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RoccosQuest-apk
          path: RoccosQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JavelinStrike-apk
          path: JavelinStrike.apk

      - name: Publish downloadable build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Rocco's Quest and Javelin Strike - Download for Android"
          prerelease: false
          make_latest: true
          body: |
            Install on Android: download **RoccosQuest.apk** or **JavelinStrike.apk** on your
            phone, open it, and allow "install unknown apps" for your browser if asked.

            Built from ${{ github.sha }}.
          files: |
            RoccosQuest.apk
            JavelinStrike.apk

      # Javelin Strike also gets its own fixed release, so its download link never
      # depends on which branch was built last.
      - name: Publish Javelin Strike
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: javelin-strike
          name: "Javelin Strike - Download for Android"
          prerelease: false
          make_latest: false
          body: |
            Install on Android: download **JavelinStrike.apk** on your phone, open it,
            and allow "install unknown apps" for your browser if asked.

            Once installed, the app updates itself: the title screen offers each new build.

            Build ${{ github.run_number }}, from ${{ github.sha }} on ${{ github.ref_name }}.
          files: |
            JavelinStrike.apk
            javelin-version.txt
