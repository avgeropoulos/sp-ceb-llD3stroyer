name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test :walk:test :walk3d:test --console=plain

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :walkapp:assembleDebug :walk3dapp:assembleDebug --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RoccosQuest.apk
          cp walkapp/build/outputs/apk/debug/walkapp-debug.apk HerculesApolloWalk.apk
          cp walk3dapp/build/outputs/apk/debug/walk3dapp-debug.apk HerculesApollo3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoccosQuest-apk
          path: RoccosQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HerculesApolloWalk-apk
          path: HerculesApolloWalk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HerculesApollo3D-apk
          path: HerculesApollo3D.apk

      - name: Publish downloadable build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Rocco's Quest + Hercules & Apollo - Download for Android"
          prerelease: false
          make_latest: true
          body: |
            Install on Android: download **RoccosQuest.apk** (Rocco's Quest),
            **HerculesApolloWalk.apk** (Hercules & Apollo: The Big Walk) or
            **HerculesApollo3D.apk** (Hercules & Apollo 3D) on your phone,
            open it, and allow "install unknown apps" for your browser if asked.

            Built from ${{ github.sha }}.
          files: |
            RoccosQuest.apk
            HerculesApolloWalk.apk
            HerculesApollo3D.apk
