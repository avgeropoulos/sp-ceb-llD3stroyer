name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test --console=plain

      - name: Run bouzouki core tests
        run: ./gradlew :bouzouki-core:test --console=plain

      - name: Build Bouzouki Lab APK
        run: ./gradlew :bouzouki:assembleDebug --console=plain

      - name: Rename APK
        run: |
          cp bouzouki/build/outputs/apk/debug/bouzouki-debug.apk BouzoukiLab.apk
          echo "$GITHUB_RUN_NUMBER" > bouzouki-lab-version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BouzoukiLab-apk
          path: BouzoukiLab.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bouzouki-core-test-reports
          path: bouzouki-core/build/reports/tests/test

      # The Lab app's own release: never the repository's "latest" one, which the original
      # Μπουζούκι app (com.bouzouki) and Rocco's Quest update from.
      - name: Publish downloadable build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-bouzouki-lab
          name: "Μπουζούκι Lab - Download for Android"
          prerelease: true
          make_latest: false
          body: |
            Install on Android: download **BouzoukiLab.apk** on your phone, open it,
            and allow "install unknown apps" for your browser if asked. It installs beside
            the original Μπουζούκι app (it is a separate app, com.bouzouki.lab).

            Built from ${{ github.sha }} (${{ github.ref_name }}).
          files: |
            BouzoukiLab.apk
            bouzouki-lab-version.txt
