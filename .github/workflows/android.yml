name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test :critters-core:test --console=plain

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :critters-app:assembleDebug --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RoccosQuest.apk
          cp critters/app/build/outputs/apk/debug/critters-app-debug.apk PocketCritters.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoccosQuest-apk
          path: RoccosQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PocketCritters-apk
          path: PocketCritters.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critter-screenshots
          path: critters/core/build/critter-shots

      - name: Publish downloadable build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Rocco's Quest and Pocket Critters - Download for Android"
          prerelease: false
          make_latest: true
          body: |
            Install on Android: download **RoccosQuest.apk** (the platformer) or
            **PocketCritters.apk** (the critter-catching RPG) on your phone, open it,
            and allow "install unknown apps" for your browser if asked.

            Built from ${{ github.sha }}.
          files: |
            RoccosQuest.apk
            PocketCritters.apk
