name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test :hero-core:test --console=plain

      - name: Run bouzouki and Bouzouki Hero tests
        run: ./gradlew :bouzouki-core:test --console=plain

      - name: Run Sitar Sitara tests
        run: ./gradlew :sitar-core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build bouzouki APK
        run: ./gradlew :bouzouki:assembleDebug --console=plain

      - name: Build Sitar Sitara APK
        run: ./gradlew :sitar:assembleDebug --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RoccosQuest.apk
          cp bouzouki/build/outputs/apk/debug/bouzouki-debug.apk Bouzouki.apk
          echo "$GITHUB_RUN_NUMBER" > bouzouki-version.txt
          cp sitar/build/outputs/apk/debug/sitar-debug.apk SitarSitara.apk
          echo "$GITHUB_RUN_NUMBER" > sitar-version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RoccosQuest-apk
          path: RoccosQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bouzouki-apk
          path: Bouzouki.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SitarSitara-apk
          path: SitarSitara.apk

      - name: Publish downloadable build
        # A push whose commit message says [no-release] is built and tested but not published.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !contains(github.event.head_commit.message, '[no-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Rocco's Quest and Μπουζούκι - Download for Android"
          prerelease: false
          # The update channel below is the "latest" release instead, so older copies of the app
          # (which update from "latest") find it too.
          make_latest: false
          body: |
            Install on Android: download **RoccosQuest.apk** or **Bouzouki.apk** on your
            phone, open it, and allow "install unknown apps" for your browser if asked.

            **Bouzouki.apk** is the Greek bouzouki app (trichordo and tetrachordo with the dromoi),
            with the Bouzouki Hero game inside.

            Built from ${{ github.sha }}.
          files: |
            RoccosQuest.apk
            Bouzouki.apk
            bouzouki-version.txt
            SitarSitara.apk

      # The Μπουζούκι app updates itself from this release (see bouzouki/.../Updater.kt), so only
      # this branch's builds go here, never another branch's.
      - name: Publish to the app's update channel
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'ccr-a8580b25-oh80s5' && !contains(github.event.head_commit.message, '[no-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bouzouki-hero
          name: "Μπουζούκι with Bouzouki Hero - in-app updates"
          prerelease: false
          make_latest: true
          body: |
            The update channel for Μπουζούκι with Bouzouki Hero. The app's ⬆ Update button installs
            the newest build from here. To install by hand, download **Bouzouki.apk** on your phone.

            Built from ${{ github.sha }}.
          files: |
            Bouzouki.apk
            bouzouki-version.txt

      # Sitar Sitara updates itself from this release (see sitar/.../Updater.kt), so only this branch's builds go
      # here. Never GitHub's "latest" release: older copies of Μπουζούκι update from that.
      - name: Publish to Sitar Sitara's update channel
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'ccr-5c0bcabf-sfawx0' && !contains(github.event.head_commit.message, '[no-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sitar-sitara
          name: "Sitar Sitara - in-app updates"
          prerelease: false
          make_latest: false
          body: |
            The update channel for Sitar Sitara (sargam for any song, with the Sitar Superstar game). The app's
            ⬆ Update button installs the newest build from here. To install by hand, download
            **SitarSitara.apk** on your phone, open it, and allow "install unknown apps" for your browser if asked.

            Built from ${{ github.sha }}.
          files: |
            SitarSitara.apk
            sitar-version.txt
