name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Thermopylae unit tests
        run: node --test spartan/tests/unit/*.test.mjs

      - name: Run game logic tests
        run: ./gradlew :core:test --console=plain

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :spartan:assembleDebug --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RoccosQuest.apk
          cp spartan/build/outputs/apk/debug/spartan-debug.apk Thermopylae.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoccosQuest-apk
          path: RoccosQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Thermopylae-apk
          path: Thermopylae.apk

      # Thermopylae's in-app updater reads this from the release below (spartan/DESIGN.md §2.2):
      # the run number is the APK's version code, and the hash lets the app check the download.
      - name: Write the Thermopylae update manifest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          jq -n \
            --argjson versionCode "$GITHUB_RUN_NUMBER" \
            --arg versionName "1.$GITHUB_RUN_NUMBER" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/latest-$GITHUB_REF_NAME/Thermopylae.apk" \
            --arg sha256 "$(sha256sum Thermopylae.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s Thermopylae.apk)" \
            --arg notes "$(git log -1 --format=%s)" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, size: $size, notes: $notes}' \
            > thermopylae-update.json
          cat thermopylae-update.json

      - name: Publish downloadable build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "Rocco's Quest and Thermopylae - Download for Android"
          prerelease: false
          make_latest: true
          body: |
            Install on Android: download the APK on your phone, open it,
            and allow "install unknown apps" for your browser if asked.

            * **RoccosQuest.apk**: Rocco's Quest, the platformer.
            * **Thermopylae.apk**: Thermopylae, a first-person Spartan last stand with
              motion controls (needs Android 7.0+ and an up-to-date Android System WebView).
              Once installed it updates itself: a newer build is offered on the title screen.

            Built from ${{ github.sha }}.
          files: |
            RoccosQuest.apk
            Thermopylae.apk

      # Published after the APKs, so the app never sees a manifest for an APK that isn't up yet.
      - name: Publish Thermopylae update manifest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          prerelease: false
          make_latest: true
          files: thermopylae-update.json
