name: Android app

on:
  push:
    paths:
      - "game/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build both apps
        working-directory: android
        run: gradle assembleClassicRelease assembleThreeDRelease --no-daemon

      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/classic/release/app-classic-release.apk BackyardBoop.apk
          cp android/app/build/outputs/apk/threeD/release/app-threeD-release.apk BackyardBoop3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BackyardBoop-apk
          path: BackyardBoop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BackyardBoop3D-apk
          path: BackyardBoop3D.apk

      # Needs "Read and write permissions" under Settings > Actions > General >
      # Workflow permissions. Without it the APK is still attached to the run above.
      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: backyard-boop-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Backyard Boop for Android (build ${{ github.run_number }})
          body: |
            Open this page on your Android phone and tap **BackyardBoop.apk** to download it.
            Android will ask you to allow installing apps from your browser the first time.
          files: BackyardBoop.apk
          make_latest: true

      # Backyard Boop 3D is its own app, so it gets its own release.
      - name: Publish a download link for Backyard Boop 3D
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: backyard-boop-3d-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Backyard Boop 3D for Android (build ${{ github.run_number }})
          body: |
            Open this page on your Android phone and tap **BackyardBoop3D.apk** to download it.
            It installs as its own app next to Backyard Boop.
            Android will ask you to allow installing apps from your browser the first time.
          files: BackyardBoop3D.apk
          make_latest: false
