name: Build Team Up! Paper 3D (Godot)
on:
  push:
    paths: ['teamup-paper/**', '.github/workflows/teamup-paper.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: teamup-paper-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.5.1
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/keystore/games.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: games
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: roccoquest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
      - name: Install Godot editor and Android templates
        run: |
          curl --retry 3 -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o editor.zip
          unzip -q editor.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl --retry 3 -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j -q templates.tpz 'templates/android_release.apk' 'templates/android_debug.apk' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm editor.zip templates.tpz
      - name: Configure Android export and version
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i "s/^version\/code=1$/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=\"0.1\"$/version\/name=\"0.${GITHUB_RUN_NUMBER}\"/" teamup-paper/export_presets.cfg
          # The game reads this to know which build it is (for in-app updates)
          sed -i "s/^config\/version=\"0\"$/config\/version=\"${GITHUB_RUN_NUMBER}\"/" teamup-paper/project.godot
          grep -q "config/version=\"${GITHUB_RUN_NUMBER}\"" teamup-paper/project.godot
          echo "${GITHUB_RUN_NUMBER}" > version.txt
      - name: Import and play-test the level
        run: |
          godot --headless --path teamup-paper --editor --import 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' import.log
          timeout 120s godot --headless --path teamup-paper --script res://tests/save_check.gd 2>&1 | tee test-save.log
          grep -q 'TEST PASSED' test-save.log
          for look in paper toy; do
            timeout 300s godot --headless --fixed-fps 60 --path teamup-paper --script res://tests/smoke.gd -- $look 2>&1 | tee test-$look.log
            grep -q 'TEST PASSED' test-$look.log
            timeout 300s godot --headless --fixed-fps 60 --path teamup-paper --script res://tests/partner_check.gd -- $look 2>&1 | tee test-partner-$look.log
            grep -q 'TEST PASSED' test-partner-$look.log
            timeout 300s godot --headless --fixed-fps 60 --path teamup-paper --script res://tests/home_check.gd -- $look 2>&1 | tee test-home-$look.log
            grep -q 'TEST PASSED' test-home-$look.log
            timeout 300s godot --headless --fixed-fps 60 --path teamup-paper --script res://tests/foes_check.gd -- $look 2>&1 | tee test-foes-$look.log
            grep -q 'TEST PASSED' test-foes-$look.log
            for world in meadow frost dunes; do
              timeout 300s godot --headless --fixed-fps 60 --path teamup-paper --script res://tests/open_check.gd -- $look $world 2>&1 | tee test-open-$world-$look.log
              grep -q 'TEST PASSED' test-open-$world-$look.log
            done
          done
          timeout 120s godot --headless --fixed-fps 60 --path teamup-paper --script res://tests/world_check.gd 2>&1 | tee test-world.log
          grep -q 'TEST PASSED' test-world.log
          for look in paper toy; do
            timeout 120s godot --headless --fixed-fps 60 --path teamup-paper --script res://tests/map_check.gd -- $look 2>&1 | tee test-map-$look.log
            grep -q 'TEST PASSED' test-map-$look.log
          done
      - name: Build signed Android APK
        run: |
          godot --headless --path teamup-paper --export-release Android ../TeamUpPaper.apk
          test -s TeamUpPaper.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify TeamUpPaper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TeamUpPaper-apk
          path: TeamUpPaper.apk
      # The APK goes up first and version.txt second, so the game never sees a new
      # version number before its APK is there to download.
      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teamup-paper-latest
          name: 'Team Up! Paper 3D — Android'
          prerelease: true
          make_latest: false
          body: |
            Install TeamUpPaper.apk on an Android tablet or phone. It's its own app, so it doesn't replace Team Up!.
            After this first install, the game updates itself: tap UPDATE! on the title screen.
            Build ${{ github.run_number }} from ${{ github.sha }} (${{ github.ref_name }}).
          files: TeamUpPaper.apk
      - name: Publish version.txt (tells installed games an update is ready)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teamup-paper-latest
          name: 'Team Up! Paper 3D — Android'
          prerelease: true
          make_latest: false
          files: version.txt
